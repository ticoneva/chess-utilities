<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzle Generator - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hash-code { font-family: monospace; background: #e9ecef; padding: 2px 6px; border-radius: 3px; }
        .share-link { word-break: break-all; font-family: monospace; font-size: 0.85rem; }
        .annotation-badge { font-size: 0.75rem; }
        .annotation-progress { font-size: 0.8rem; color: #6c757d; }
        .status-cell { min-width: 120px; }
        .status-progress-bar { height: 16px; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div class="container py-4" style="max-width: 750px;">
        <h4 class="mb-4">Chess Puzzle Generator - Admin</h4>

        <!-- Upload form -->
        <div class="card mb-4">
            <div class="card-body">
                <h6 class="card-title">Upload PGN Set</h6>
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="password" class="form-label">Admin Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="pgnFile" class="form-label">PGN File</label>
                        <input type="file" class="form-control" id="pgnFile" accept=".pgn" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload</button>
                    <span id="uploadStatus" class="ms-3"></span>
                </form>
            </div>
        </div>

        <!-- Re-scan button -->
        <div class="card mb-4">
            <div class="card-body d-flex align-items-center">
                <div>
                    <h6 class="card-title mb-1">Re-scan PGN Directory</h6>
                    <small class="text-muted">Use after manually placing PGN files in the server folder.</small>
                </div>
                <button class="btn btn-outline-secondary ms-auto" id="rescanBtn">Re-scan</button>
                <span id="rescanStatus" class="ms-2"></span>
            </div>
        </div>

        <!-- Existing sets -->
        <div class="card">
            <div class="card-body">
                <h6 class="card-title mb-3">Remote Puzzle Sets</h6>
                <div id="setsTable">
                    <p class="text-muted mb-0">Loading...</p>
                </div>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="./">Back to Puzzle Generator</a>
        </div>
    </div>

    <script>
    var pollingIntervals = {};

    function clearAllPolling() {
        for (var hash in pollingIntervals) {
            clearInterval(pollingIntervals[hash]);
        }
        pollingIntervals = {};
    }

    function renderStatusCell(hash) {
        return '<div id="status-cell-' + hash + '">' +
            '<span class="badge bg-light text-dark annotation-badge" id="status-' + hash + '">—</span>' +
            '</div>';
    }

    function updateStatusDisplay(hash, data) {
        var badge = document.getElementById('status-' + hash);
        var cell = document.getElementById('status-cell-' + hash);
        if (!badge || !cell) return;

        var status = data.status;
        if (status === 'complete') {
            badge.className = 'badge bg-success annotation-badge';
            badge.textContent = 'Annotated';
            cell.innerHTML = '<span class="badge bg-success annotation-badge">Annotated</span>';
            if (pollingIntervals[hash]) { clearInterval(pollingIntervals[hash]); delete pollingIntervals[hash]; }
        } else if (status === 'annotating') {
            var pct = data.total > 0 ? Math.round((data.progress / data.total) * 100) : 0;
            cell.innerHTML =
                '<div class="progress status-progress-bar mb-1"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:' + pct + '%">' + pct + '%</div></div>' +
                '<small class="annotation-progress">' + data.message + '</small>';
        } else if (status === 'pending') {
            cell.innerHTML = '<span class="badge bg-info annotation-badge">Queued</span>' +
                '<small class="annotation-progress ms-1">Waiting to start...</small>';
        } else if (status === 'error') {
            cell.innerHTML = '<span class="badge bg-danger annotation-badge">Error</span>' +
                '<small class="text-danger ms-1">' + data.message + '</small>';
            if (pollingIntervals[hash]) { clearInterval(pollingIntervals[hash]); delete pollingIntervals[hash]; }
        } else {
            cell.innerHTML = '<span class="badge bg-light text-dark annotation-badge">—</span>';
            if (pollingIntervals[hash]) { clearInterval(pollingIntervals[hash]); delete pollingIntervals[hash]; }
        }
    }

    function pollAnnotationStatus(hash) {
        if (pollingIntervals[hash]) clearInterval(pollingIntervals[hash]);
        pollingIntervals[hash] = setInterval(function() {
            fetch('annotation_status/' + hash)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    updateStatusDisplay(hash, data);
                    if (data.status === 'complete' || data.status === 'error' || data.status === 'unknown') {
                        clearInterval(pollingIntervals[hash]);
                        delete pollingIntervals[hash];
                    }
                })
                .catch(function() {
                    clearInterval(pollingIntervals[hash]);
                    delete pollingIntervals[hash];
                });
        }, 2000);
    }

    function fetchAllAnnotationStatuses() {
        fetch('list_remote_sets')
            .then(function(r) { return r.json(); })
            .then(function(sets) {
                sets.forEach(function(s) {
                    fetch('annotation_status/' + s.hash)
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            updateStatusDisplay(s.hash, data);
                            if (data.status === 'annotating' || data.status === 'pending') {
                                pollAnnotationStatus(s.hash);
                            }
                        });
                });
            });
    }

    function loadSets() {
        fetch('list_remote_sets')
            .then(r => r.json())
            .then(sets => {
                var container = document.getElementById('setsTable');
                if (!sets.length) {
                    container.innerHTML = '<p class="text-muted mb-0">No remote sets found.</p>';
                    return;
                }
                var html = '<table class="table table-sm mb-0"><thead><tr>' +
                    '<th>Name</th><th>Hash</th><th>Games</th><th>Status</th><th>Share Link</th>' +
                    '</tr></thead><tbody>';
                sets.forEach(function(s) {
                    var link = window.location.origin + window.location.pathname.replace(/\/admin$/, '') + '/#set=' + s.hash;
                    html += '<tr>' +
                        '<td>' + s.name + '</td>' +
                        '<td><span class="hash-code">' + s.hash + '</span></td>' +
                        '<td>' + s.num_games + '</td>' +
                        '<td class="status-cell">' + renderStatusCell(s.hash) + '</td>' +
                        '<td><a href="' + link + '" class="share-link">' + link + '</a></td>' +
                        '</tr>';
                });
                html += '</tbody></table>';
                container.innerHTML = html;
                // Fetch statuses after table is rendered
                fetchAllAnnotationStatuses();
            })
            .catch(function() {
                document.getElementById('setsTable').innerHTML =
                    '<p class="text-danger mb-0">Failed to load sets.</p>';
            });
    }

    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var status = document.getElementById('uploadStatus');
        status.textContent = 'Uploading...';
        status.className = 'ms-3 text-muted';

        var formData = new FormData();
        formData.append('password', document.getElementById('password').value);
        formData.append('file', document.getElementById('pgnFile').files[0]);

        fetch('admin_upload_set', { method: 'POST', body: formData })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) {
                    status.textContent = data.error;
                    status.className = 'ms-3 text-danger';
                } else {
                    var link = window.location.origin + window.location.pathname.replace(/\/admin$/, '') + '/#set=' + data.hash;
                    status.innerHTML = 'Uploaded! Share link: <a href="' + link + '">' + link + '</a>';
                    status.className = 'ms-3 text-success';
                    document.getElementById('pgnFile').value = '';
                    // Reload sets table which will pick up annotation status
                    loadSets();
                }
            })
            .catch(function(err) {
                status.textContent = 'Upload failed';
                status.className = 'ms-3 text-danger';
            });
    });

    document.getElementById('rescanBtn').addEventListener('click', function() {
        var status = document.getElementById('rescanStatus');
        status.textContent = 'Scanning...';
        fetch('rescan_sets', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                status.textContent = 'Found ' + data.count + ' set(s)';
                loadSets();
            })
            .catch(function() {
                status.textContent = 'Failed';
            });
    });

    loadSets();
    </script>
</body>
</html>
