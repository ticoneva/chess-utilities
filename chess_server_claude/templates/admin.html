<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzle Generator - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hash-code { font-family: monospace; background: #e9ecef; padding: 2px 6px; border-radius: 3px; }
        .share-link { word-break: break-all; font-family: monospace; font-size: 0.85rem; }
        .annotation-badge { font-size: 0.75rem; }
        .annotation-progress { font-size: 0.8rem; color: #6c757d; }
    </style>
</head>
<body>
    <div class="container py-4" style="max-width: 700px;">
        <h4 class="mb-4">Chess Puzzle Generator - Admin</h4>

        <!-- Upload form -->
        <div class="card mb-4">
            <div class="card-body">
                <h6 class="card-title">Upload PGN Set</h6>
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="password" class="form-label">Admin Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="pgnFile" class="form-label">PGN File</label>
                        <input type="file" class="form-control" id="pgnFile" accept=".pgn" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload</button>
                    <span id="uploadStatus" class="ms-3"></span>
                    <div id="annotationProgress" class="mt-2" style="display:none;">
                        <div class="progress mb-1" style="height: 20px;">
                            <div id="annotationProgressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                        </div>
                        <small id="annotationProgressText" class="annotation-progress"></small>
                    </div>
                </form>
            </div>
        </div>

        <!-- Re-scan button -->
        <div class="card mb-4">
            <div class="card-body d-flex align-items-center">
                <div>
                    <h6 class="card-title mb-1">Re-scan PGN Directory</h6>
                    <small class="text-muted">Use after manually placing PGN files in the server folder.</small>
                </div>
                <button class="btn btn-outline-secondary ms-auto" id="rescanBtn">Re-scan</button>
                <span id="rescanStatus" class="ms-2"></span>
            </div>
        </div>

        <!-- Existing sets -->
        <div class="card">
            <div class="card-body">
                <h6 class="card-title mb-3">Remote Puzzle Sets</h6>
                <div id="setsTable">
                    <p class="text-muted mb-0">Loading...</p>
                </div>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="./">Back to Puzzle Generator</a>
        </div>
    </div>

    <script>
    var pollingIntervals = {};

    function pollAnnotationStatus(hash, progressBar, progressText, progressContainer) {
        if (pollingIntervals[hash]) clearInterval(pollingIntervals[hash]);
        pollingIntervals[hash] = setInterval(function() {
            fetch('annotation_status/' + hash)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.status === 'annotating') {
                        var pct = data.total > 0 ? Math.round((data.progress / data.total) * 100) : 0;
                        if (progressBar) {
                            progressBar.style.width = pct + '%';
                            progressBar.textContent = pct + '%';
                        }
                        if (progressText) progressText.textContent = data.message;
                    } else if (data.status === 'complete') {
                        if (progressBar) {
                            progressBar.style.width = '100%';
                            progressBar.textContent = '100%';
                            progressBar.classList.remove('progress-bar-animated');
                        }
                        if (progressText) progressText.textContent = 'Annotation complete';
                        clearInterval(pollingIntervals[hash]);
                        updateStatusBadge(hash, 'complete');
                        setTimeout(function() {
                            if (progressContainer) progressContainer.style.display = 'none';
                        }, 3000);
                    } else if (data.status === 'error') {
                        if (progressText) progressText.textContent = 'Annotation failed: ' + data.message;
                        if (progressBar) {
                            progressBar.classList.remove('progress-bar-animated');
                            progressBar.classList.add('bg-danger');
                        }
                        clearInterval(pollingIntervals[hash]);
                        updateStatusBadge(hash, 'error');
                    } else if (data.status === 'pending') {
                        if (progressText) progressText.textContent = 'Queued for annotation...';
                    } else {
                        clearInterval(pollingIntervals[hash]);
                        updateStatusBadge(hash, data.status);
                    }
                })
                .catch(function() { clearInterval(pollingIntervals[hash]); });
        }, 2000);
    }

    function updateStatusBadge(hash, status) {
        var badge = document.getElementById('status-' + hash);
        if (!badge) return;
        if (status === 'complete') {
            badge.className = 'badge bg-success annotation-badge';
            badge.textContent = 'Annotated';
        } else if (status === 'annotating') {
            badge.className = 'badge bg-warning annotation-badge';
            badge.textContent = 'Annotating...';
        } else if (status === 'pending') {
            badge.className = 'badge bg-info annotation-badge';
            badge.textContent = 'Queued';
        } else if (status === 'error') {
            badge.className = 'badge bg-danger annotation-badge';
            badge.textContent = 'Error';
        } else {
            badge.className = 'badge bg-secondary annotation-badge';
            badge.textContent = 'Unknown';
        }
    }

    function fetchAllAnnotationStatuses() {
        fetch('list_remote_sets')
            .then(function(r) { return r.json(); })
            .then(function(sets) {
                sets.forEach(function(s) {
                    fetch('annotation_status/' + s.hash)
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            updateStatusBadge(s.hash, data.status);
                            if (data.status === 'annotating' || data.status === 'pending') {
                                pollAnnotationStatus(s.hash, null, null, null);
                            }
                        });
                });
            });
    }

    function loadSets() {
        fetch('list_remote_sets')
            .then(r => r.json())
            .then(sets => {
                var container = document.getElementById('setsTable');
                if (!sets.length) {
                    container.innerHTML = '<p class="text-muted mb-0">No remote sets found.</p>';
                    return;
                }
                var html = '<table class="table table-sm mb-0"><thead><tr>' +
                    '<th>Name</th><th>Hash</th><th>Games</th><th>Status</th><th>Share Link</th>' +
                    '</tr></thead><tbody>';
                sets.forEach(function(s) {
                    var link = window.location.origin + window.location.pathname.replace(/\/admin$/, '') + '/#set=' + s.hash;
                    var statusBadge = '<span class="badge bg-secondary annotation-badge" id="status-' + s.hash + '">Checking...</span>';
                    html += '<tr>' +
                        '<td>' + s.name + '</td>' +
                        '<td><span class="hash-code">' + s.hash + '</span></td>' +
                        '<td>' + s.num_games + '</td>' +
                        '<td>' + statusBadge + '</td>' +
                        '<td><a href="' + link + '" class="share-link">' + link + '</a></td>' +
                        '</tr>';
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            })
            .catch(function() {
                document.getElementById('setsTable').innerHTML =
                    '<p class="text-danger mb-0">Failed to load sets.</p>';
            });
    }

    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var status = document.getElementById('uploadStatus');
        status.textContent = 'Uploading...';
        status.className = 'ms-3 text-muted';

        var formData = new FormData();
        formData.append('password', document.getElementById('password').value);
        formData.append('file', document.getElementById('pgnFile').files[0]);

        fetch('admin_upload_set', { method: 'POST', body: formData })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) {
                    status.textContent = data.error;
                    status.className = 'ms-3 text-danger';
                } else {
                    var link = window.location.origin + window.location.pathname.replace(/\/admin$/, '') + '/#set=' + data.hash;
                    status.innerHTML = 'Uploaded! Share link: <a href="' + link + '">' + link + '</a>';
                    status.className = 'ms-3 text-success';
                    document.getElementById('pgnFile').value = '';
                    // Show annotation progress
                    var progressContainer = document.getElementById('annotationProgress');
                    var progressBar = document.getElementById('annotationProgressBar');
                    var progressText = document.getElementById('annotationProgressText');
                    progressContainer.style.display = 'block';
                    progressBar.style.width = '0%';
                    progressBar.textContent = '';
                    progressBar.className = 'progress-bar progress-bar-striped progress-bar-animated';
                    progressText.textContent = 'Starting annotation...';
                    pollAnnotationStatus(data.hash, progressBar, progressText, progressContainer);
                    loadSets();
                }
            })
            .catch(function(err) {
                status.textContent = 'Upload failed';
                status.className = 'ms-3 text-danger';
            });
    });

    document.getElementById('rescanBtn').addEventListener('click', function() {
        var status = document.getElementById('rescanStatus');
        status.textContent = 'Scanning...';
        fetch('rescan_sets', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                status.textContent = 'Found ' + data.count + ' set(s)';
                loadSets();
            })
            .catch(function() {
                status.textContent = 'Failed';
            });
    });

    loadSets();
    fetchAllAnnotationStatuses();
    </script>
</body>
</html>
